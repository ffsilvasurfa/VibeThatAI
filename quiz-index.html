<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Links</title>
<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --ink:#101828;
    --ink-soft:#475467;
    --accent:#0F766E;
    --accent-soft:#E4F3F1;
    --danger:#B42318;
    --danger-soft:#FBEAE8;
    --border:#D0D5DD;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .wrap{ width:100%; max-width:620px; }
  header{
    display:flex;
    align-items:baseline;
    gap:18px;
    margin-bottom:24px;
  }
  .week-num{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:56px;
    font-weight:600;
    color:var(--accent);
    line-height:1;
  }
  .head-text h1{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:22px;
    margin:0 0 4px;
  }
  .head-text p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .progress-track{
    height:6px;
    background:var(--border);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:28px;
  }
  .prompt{
    font-size:17px;
    font-weight:600;
    margin:0 0 20px;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:14px 16px;
    margin-bottom:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
  }
  .option:hover:not(:disabled){ border-color:var(--accent); }
  .option:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .option.correct{ background:var(--accent-soft); border-color:var(--accent); }
  .option.incorrect{ background:var(--danger-soft); border-color:var(--danger); }
  .option:disabled{ cursor:default; }
  .feedback{
    margin-top:16px;
    padding:14px 16px;
    border-radius:8px;
    font-size:14px;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct-fb{ background:var(--accent-soft); color:#0B4F49; }
  .feedback.incorrect-fb{ background:var(--danger-soft); color:#7A1913; }
  .feedback strong{ display:block; margin-bottom:4px; }
  .actions{ margin-top:20px; display:flex; justify-content:flex-end; }
  button.next{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:none;
    font-family:inherit;
  }
  button.next.show{ display:inline-block; }
  button.next:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
  .summary{ text-align:center; }
  .summary .score{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:48px;
    color:var(--accent);
    margin:8px 0;
  }
  .retake{
    margin-top:20px;
    background:none;
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  footer{
    margin-top:20px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
  <ul>
    <li>Week 1: </li>
    <li>Week 2: </li>
    <li>Week 3: </li>
    <li>Week 4: </li>
    <li>Week 5: </li>
    <li>Week 6: </li>
    <li>Week 7: </li>
    <li>Week 8: </li>
    <li>Week 9: </li>
    <li>Week 10: </li>
  </ul>
  </header>

</body>
</html>
