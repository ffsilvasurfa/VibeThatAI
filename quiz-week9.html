<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 9 Self-Test — Machine Learning & Neural Networks</title>
<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --ink:#101828;
    --ink-soft:#475467;
    --accent:#0F766E;
    --accent-soft:#E4F3F1;
    --danger:#B42318;
    --danger-soft:#FBEAE8;
    --border:#D0D5DD;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .wrap{ width:100%; max-width:620px; }
  header{
    display:flex;
    align-items:baseline;
    gap:18px;
    margin-bottom:24px;
  }
  .week-num{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:56px;
    font-weight:600;
    color:var(--accent);
    line-height:1;
  }
  .head-text h1{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:22px;
    margin:0 0 4px;
  }
  .head-text p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .progress-track{
    height:6px;
    background:var(--border);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:28px;
  }
  .prompt{
    font-size:17px;
    font-weight:600;
    margin:0 0 20px;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:14px 16px;
    margin-bottom:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
  }
  .option:hover:not(:disabled){ border-color:var(--accent); }
  .option:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .option.correct{ background:var(--accent-soft); border-color:var(--accent); }
  .option.incorrect{ background:var(--danger-soft); border-color:var(--danger); }
  .option:disabled{ cursor:default; }
  .feedback{
    margin-top:16px;
    padding:14px 16px;
    border-radius:8px;
    font-size:14px;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct-fb{ background:var(--accent-soft); color:#0B4F49; }
  .feedback.incorrect-fb{ background:var(--danger-soft); color:#7A1913; }
  .feedback strong{ display:block; margin-bottom:4px; }
  .actions{ margin-top:20px; display:flex; justify-content:flex-end; }
  button.next{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:none;
    font-family:inherit;
  }
  button.next.show{ display:inline-block; }
  button.next:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
  .summary{ text-align:center; }
  .summary .score{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:48px;
    color:var(--accent);
    margin:8px 0;
  }
  .retake{
    margin-top:20px;
    background:none;
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  footer{
    margin-top:20px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="week-num" id="weekNum">01</div>
    <div class="head-text">
      <h1 id="quizTitle">Loading…</h1>
      <p id="quizDesc"></p>
    </div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>

  <div class="card" id="card"></div>

  <footer>Your score is only shown to you. Anonymous, aggregate answer data helps improve future sessions.</footer>
</div>

<script>
// ---- CONFIG: swap this object per week, keep the engine below unchanged ----
const QUIZ_CONFIG = {
  week: "week9",
  weekLabel: "09",
  title: "Machine Learning & Neural Networks",
  description: "Self-test: ANNs, training, overfitting, and how transformers differ from earlier approaches.",
  // Paste your Apps Script /exec URL here once deployed. Leave blank to disable stats posting.
  scriptUrl: "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE",
  questions: [
    {
      id: "q1",
      prompt: "In an artificial neural network, what does a single neuron typically compute?",
      options: [
        { id: "a", text: "A weighted sum of its inputs, passed through an activation function" },
        { id: "b", text: "A random number, unrelated to its inputs" },
        { id: "c", text: "The exact average of every neuron in the network" },
        { id: "d", text: "A lookup into a fixed table of pre-written answers" },
      ],
      correct: "a",
      explanation: "Each neuron combines its inputs with learned weights (plus a bias), sums them, and passes the result through a non-linear activation function — this non-linearity is what lets networks learn complex functions."
    },
    {
      id: "q2",
      prompt: "What is backpropagation used for?",
      options: [
        { id: "a", text: "Deleting neurons that are no longer needed" },
        { id: "b", text: "Computing how much each weight contributed to the error, so weights can be updated via gradient descent" },
        { id: "c", text: "Generating the training dataset automatically" },
        { id: "d", text: "Converting a neural network into a decision tree" },
      ],
      correct: "b",
      explanation: "Backpropagation applies the chain rule to efficiently compute the gradient of the loss with respect to every weight in the network, which gradient descent then uses to adjust those weights."
    },
    {
      id: "q3",
      prompt: "A model that performs very well on training data but poorly on new, unseen data is exhibiting:",
      options: [
        { id: "a", text: "Underfitting" },
        { id: "b", text: "Overfitting" },
        { id: "c", text: "Perfect generalisation" },
        { id: "d", text: "Zero-shot learning" },
      ],
      correct: "b",
      explanation: "Overfitting means the model has learned patterns specific to (or noise in) the training data rather than the underlying general pattern, so it fails to generalise to new examples."
    },
    {
      id: "q4",
      prompt: "What is the key difference between supervised and unsupervised learning?",
      options: [
        { id: "a", text: "Supervised learning uses labelled input-output examples; unsupervised learning finds structure in unlabelled data" },
        { id: "b", text: "Unsupervised learning always requires more labelled data than supervised learning" },
        { id: "c", text: "They are two names for exactly the same process" },
        { id: "d", text: "Supervised learning never uses any numerical data" },
      ],
      correct: "a",
      explanation: "Supervised learning trains on examples with known correct outputs (labels); unsupervised learning looks for patterns, clusters, or structure in data that has no labels at all."
    },
    {
      id: "q5",
      prompt: "What problem does self-attention in transformers address better than earlier recurrent (RNN) approaches?",
      options: [
        { id: "a", text: "Transformers can only process one word at a time, just like RNNs" },
        { id: "b", text: "Self-attention lets the model directly relate distant tokens and process the sequence in parallel, easing long-range dependency and speed limitations RNNs had" },
        { id: "c", text: "Self-attention removes the need for any training data" },
        { id: "d", text: "RNNs already solved long-range dependencies perfectly, so transformers changed nothing" },
      ],
      correct: "b",
      explanation: "RNNs process sequences step by step, which makes long-range dependencies hard to learn and training slow (no parallelism). Self-attention lets every token attend directly to every other token, both easing long-range learning and enabling parallel computation."
    }
  ]
};
// ---- END CONFIG ----

let current = 0;
let score = 0;
const total = QUIZ_CONFIG.questions.length;

document.getElementById("weekNum").textContent = QUIZ_CONFIG.weekLabel;
document.getElementById("quizTitle").textContent = QUIZ_CONFIG.title;
document.getElementById("quizDesc").textContent = QUIZ_CONFIG.description;

function postResult(questionId, chosen, correct){
  if (!QUIZ_CONFIG.scriptUrl || QUIZ_CONFIG.scriptUrl.startsWith("PASTE_")) return;
  try{
    fetch(QUIZ_CONFIG.scriptUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        week: QUIZ_CONFIG.week,
        question_id: questionId,
        chosen: chosen,
        correct: correct
      })
    });
  }catch(err){ /* fail silently, stats are best-effort */ }
}

function renderQuestion(){
  const q = QUIZ_CONFIG.questions[current];
  document.getElementById("progressLabel").textContent = `Question ${current+1} of ${total}`;
  document.getElementById("progressFill").style.width = `${(current/total)*100}%`;

  const card = document.getElementById("card");
  card.innerHTML = "";

  const promptEl = document.createElement("p");
  promptEl.className = "prompt";
  promptEl.textContent = q.prompt;
  card.appendChild(promptEl);

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt.text;
    btn.addEventListener("click", () => selectOption(opt.id, btn));
    card.appendChild(btn);
  });

  const fb = document.createElement("div");
  fb.className = "feedback";
  fb.id = "feedback";
  card.appendChild(fb);

  const actions = document.createElement("div");
  actions.className = "actions";
  const nextBtn = document.createElement("button");
  nextBtn.className = "next";
  nextBtn.id = "nextBtn";
  nextBtn.textContent = current === total - 1 ? "See results" : "Next question";
  nextBtn.addEventListener("click", advance);
  actions.appendChild(nextBtn);
  card.appendChild(actions);
}

function selectOption(chosenId, btnEl){
  const q = QUIZ_CONFIG.questions[current];
  const isCorrect = chosenId === q.correct;
  if (isCorrect) score++;

  document.querySelectorAll(".option").forEach(b => {
    b.disabled = true;
    if (b === btnEl) b.classList.add(isCorrect ? "correct" : "incorrect");
    if (!isCorrect && b.textContent === q.options.find(o => o.id === q.correct).text){
      b.classList.add("correct");
    }
  });

  const fb = document.getElementById("feedback");
  fb.classList.add("show", isCorrect ? "correct-fb" : "incorrect-fb");
  fb.innerHTML = `<strong>${isCorrect ? "Correct." : "Not quite."}</strong>${q.explanation}`;

  document.getElementById("nextBtn").classList.add("show");
  postResult(q.id, chosenId, isCorrect);
}

function advance(){
  current++;
  if (current < total){
    renderQuestion();
  }else{
    showSummary();
  }
}

function showSummary(){
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("progressLabel").textContent = "Complete";
  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="summary">
      <p>You scored</p>
      <div class="score">${score} / ${total}</div>
      <button class="retake" id="retakeBtn">Retake quiz</button>
    </div>
  `;
  document.getElementById("retakeBtn").addEventListener("click", () => {
    current = 0; score = 0; renderQuestion();
  });
}

renderQuestion();
</script>
</body>
</html>
