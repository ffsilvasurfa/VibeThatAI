<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 6 Self-Test — LLMs & Agentic AI</title>
<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --ink:#101828;
    --ink-soft:#475467;
    --accent:#0F766E;
    --accent-soft:#E4F3F1;
    --danger:#B42318;
    --danger-soft:#FBEAE8;
    --border:#D0D5DD;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .wrap{ width:100%; max-width:620px; }
  header{
    display:flex;
    align-items:baseline;
    gap:18px;
    margin-bottom:24px;
  }
  .week-num{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:56px;
    font-weight:600;
    color:var(--accent);
    line-height:1;
  }
  .head-text h1{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:22px;
    margin:0 0 4px;
  }
  .head-text p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .progress-track{
    height:6px;
    background:var(--border);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:28px;
  }
  .prompt{
    font-size:17px;
    font-weight:600;
    margin:0 0 20px;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:14px 16px;
    margin-bottom:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
  }
  .option:hover:not(:disabled){ border-color:var(--accent); }
  .option:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .option.correct{ background:var(--accent-soft); border-color:var(--accent); }
  .option.incorrect{ background:var(--danger-soft); border-color:var(--danger); }
  .option:disabled{ cursor:default; }
  .feedback{
    margin-top:16px;
    padding:14px 16px;
    border-radius:8px;
    font-size:14px;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct-fb{ background:var(--accent-soft); color:#0B4F49; }
  .feedback.incorrect-fb{ background:var(--danger-soft); color:#7A1913; }
  .feedback strong{ display:block; margin-bottom:4px; }
  .actions{ margin-top:20px; display:flex; justify-content:flex-end; }
  button.next{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:none;
    font-family:inherit;
  }
  button.next.show{ display:inline-block; }
  button.next:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
  .summary{ text-align:center; }
  .summary .score{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:48px;
    color:var(--accent);
    margin:8px 0;
  }
  .retake{
    margin-top:20px;
    background:none;
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  footer{
    margin-top:20px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="week-num" id="weekNum">01</div>
    <div class="head-text">
      <h1 id="quizTitle">Loading…</h1>
      <p id="quizDesc"></p>
    </div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>

  <div class="card" id="card"></div>

  <footer>Your score is only shown to you. Anonymous, aggregate answer data helps improve future sessions.</footer>
</div>

<script>
// ---- CONFIG: swap this object per week, keep the engine below unchanged ----
const QUIZ_CONFIG = {
  week: "week6",
  weekLabel: "06",
  title: "LLMs & Agentic AI",
  description: "Self-test: how LLMs work at a high level, prompting practice, and agentic patterns.",
  // Paste your Apps Script /exec URL here once deployed. Leave blank to disable stats posting.
  scriptUrl: "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE",
  questions: [
    {
      id: "q1",
      prompt: "At a high level, what is the \"attention\" mechanism in a transformer doing?",
      options: [
        { id: "a", text: "Randomly dropping words from the input to reduce size" },
        { id: "b", text: "Weighing how relevant every other token is when building the representation of a given token" },
        { id: "c", text: "Compressing the whole input into a single fixed number before any processing" },
        { id: "d", text: "Storing the entire training dataset for lookup at inference time" },
      ],
      correct: "b",
      explanation: "Attention lets the model weigh, for each token, how much every other token in the sequence should influence its representation — which is how transformers capture context and long-range relationships."
    },
    {
      id: "q2",
      prompt: "What does Retrieval-Augmented Generation (RAG) add to a plain LLM call?",
      options: [
        { id: "a", text: "It retrains the model's weights on the fly for every query" },
        { id: "b", text: "It fetches relevant external documents/data and feeds them into the prompt as context before generating an answer" },
        { id: "c", text: "It removes the need for any prompt at all" },
        { id: "d", text: "It guarantees the model can never produce an incorrect answer" },
      ],
      correct: "b",
      explanation: "RAG retrieves relevant passages from an external source (a document store, database, or search index) and injects them into the context, so the model can ground its answer in information beyond what it memorised during training."
    },
    {
      id: "q3",
      prompt: "What's the key structural difference between a single LLM API call and an \"agent\"?",
      options: [
        { id: "a", text: "There is no real difference — they're the same thing" },
        { id: "b", text: "An agent loops: it can plan, call tools, observe results, and decide on further steps, rather than just returning one response" },
        { id: "c", text: "Agents never use language models at all" },
        { id: "d", text: "A single call always produces a longer response than an agent" },
      ],
      correct: "b",
      explanation: "A single call takes input and returns output once. An agent typically runs a loop — deciding on an action (often calling a tool), observing the result, and deciding what to do next — until it judges the task complete."
    },
    {
      id: "q4",
      prompt: "Which of these is the best example of a token-efficient prompting habit?",
      options: [
        { id: "a", text: "Pasting the entire codebase into every prompt, just in case it's needed" },
        { id: "b", text: "Scoping the request precisely and iterating on a working result, rather than re-describing everything from scratch each time" },
        { id: "c", text: "Asking for the maximum possible output length by default" },
        { id: "d", text: "Never giving the model any context about the task" },
      ],
      correct: "b",
      explanation: "Precise scoping and iterating on an existing result avoids re-sending large amounts of redundant context, which is what actually drives token cost up — not the number of prompts sent."
    },
    {
      id: "q5",
      prompt: "Why do agentic systems (ones that can take actions, not just generate text) raise different safety considerations than a plain chat response?",
      options: [
        { id: "a", text: "They don't — actions and text carry identical risk" },
        { id: "b", text: "A wrong or manipulated action (like sending a real email or deleting a file) has real-world consequences a wrong sentence doesn't" },
        { id: "c", text: "Agentic systems are always slower, which is the only concern" },
        { id: "d", text: "Agentic systems cannot call external tools, so risk is lower" },
      ],
      correct: "b",
      explanation: "Once a system can act in the world — sending messages, modifying files, spending money — a mistake or successful manipulation has direct consequences, not just an incorrect sentence the user reads and can ignore."
    }
  ]
};
// ---- END CONFIG ----

let current = 0;
let score = 0;
const total = QUIZ_CONFIG.questions.length;

document.getElementById("weekNum").textContent = QUIZ_CONFIG.weekLabel;
document.getElementById("quizTitle").textContent = QUIZ_CONFIG.title;
document.getElementById("quizDesc").textContent = QUIZ_CONFIG.description;

function postResult(questionId, chosen, correct){
  if (!QUIZ_CONFIG.scriptUrl || QUIZ_CONFIG.scriptUrl.startsWith("PASTE_")) return;
  try{
    fetch(QUIZ_CONFIG.scriptUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        week: QUIZ_CONFIG.week,
        question_id: questionId,
        chosen: chosen,
        correct: correct
      })
    });
  }catch(err){ /* fail silently, stats are best-effort */ }
}

function renderQuestion(){
  const q = QUIZ_CONFIG.questions[current];
  document.getElementById("progressLabel").textContent = `Question ${current+1} of ${total}`;
  document.getElementById("progressFill").style.width = `${(current/total)*100}%`;

  const card = document.getElementById("card");
  card.innerHTML = "";

  const promptEl = document.createElement("p");
  promptEl.className = "prompt";
  promptEl.textContent = q.prompt;
  card.appendChild(promptEl);

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt.text;
    btn.addEventListener("click", () => selectOption(opt.id, btn));
    card.appendChild(btn);
  });

  const fb = document.createElement("div");
  fb.className = "feedback";
  fb.id = "feedback";
  card.appendChild(fb);

  const actions = document.createElement("div");
  actions.className = "actions";
  const nextBtn = document.createElement("button");
  nextBtn.className = "next";
  nextBtn.id = "nextBtn";
  nextBtn.textContent = current === total - 1 ? "See results" : "Next question";
  nextBtn.addEventListener("click", advance);
  actions.appendChild(nextBtn);
  card.appendChild(actions);
}

function selectOption(chosenId, btnEl){
  const q = QUIZ_CONFIG.questions[current];
  const isCorrect = chosenId === q.correct;
  if (isCorrect) score++;

  document.querySelectorAll(".option").forEach(b => {
    b.disabled = true;
    if (b === btnEl) b.classList.add(isCorrect ? "correct" : "incorrect");
    if (!isCorrect && b.textContent === q.options.find(o => o.id === q.correct).text){
      b.classList.add("correct");
    }
  });

  const fb = document.getElementById("feedback");
  fb.classList.add("show", isCorrect ? "correct-fb" : "incorrect-fb");
  fb.innerHTML = `<strong>${isCorrect ? "Correct." : "Not quite."}</strong>${q.explanation}`;

  document.getElementById("nextBtn").classList.add("show");
  postResult(q.id, chosenId, isCorrect);
}

function advance(){
  current++;
  if (current < total){
    renderQuestion();
  }else{
    showSummary();
  }
}

function showSummary(){
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("progressLabel").textContent = "Complete";
  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="summary">
      <p>You scored</p>
      <div class="score">${score} / ${total}</div>
      <button class="retake" id="retakeBtn">Retake quiz</button>
    </div>
  `;
  document.getElementById("retakeBtn").addEventListener("click", () => {
    current = 0; score = 0; renderQuestion();
  });
}

renderQuestion();
</script>
</body>
</html>
