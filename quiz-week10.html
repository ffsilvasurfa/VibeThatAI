<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 10 Self-Test — Robotics & Perception</title>
<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --ink:#101828;
    --ink-soft:#475467;
    --accent:#0F766E;
    --accent-soft:#E4F3F1;
    --danger:#B42318;
    --danger-soft:#FBEAE8;
    --border:#D0D5DD;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .wrap{ width:100%; max-width:620px; }
  header{
    display:flex;
    align-items:baseline;
    gap:18px;
    margin-bottom:24px;
  }
  .week-num{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:56px;
    font-weight:600;
    color:var(--accent);
    line-height:1;
  }
  .head-text h1{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:22px;
    margin:0 0 4px;
  }
  .head-text p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .progress-track{
    height:6px;
    background:var(--border);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:28px;
  }
  .prompt{
    font-size:17px;
    font-weight:600;
    margin:0 0 20px;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:14px 16px;
    margin-bottom:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
  }
  .option:hover:not(:disabled){ border-color:var(--accent); }
  .option:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .option.correct{ background:var(--accent-soft); border-color:var(--accent); }
  .option.incorrect{ background:var(--danger-soft); border-color:var(--danger); }
  .option:disabled{ cursor:default; }
  .feedback{
    margin-top:16px;
    padding:14px 16px;
    border-radius:8px;
    font-size:14px;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct-fb{ background:var(--accent-soft); color:#0B4F49; }
  .feedback.incorrect-fb{ background:var(--danger-soft); color:#7A1913; }
  .feedback strong{ display:block; margin-bottom:4px; }
  .actions{ margin-top:20px; display:flex; justify-content:flex-end; }
  button.next{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:none;
    font-family:inherit;
  }
  button.next.show{ display:inline-block; }
  button.next:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
  .summary{ text-align:center; }
  .summary .score{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:48px;
    color:var(--accent);
    margin:8px 0;
  }
  .retake{
    margin-top:20px;
    background:none;
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  footer{
    margin-top:20px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="week-num" id="weekNum">01</div>
    <div class="head-text">
      <h1 id="quizTitle">Loading…</h1>
      <p id="quizDesc"></p>
    </div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>

  <div class="card" id="card"></div>

  <footer>Your score is only shown to you. Anonymous, aggregate answer data helps improve future sessions.</footer>
</div>

<script>
// ---- CONFIG: swap this object per week, keep the engine below unchanged ----
const QUIZ_CONFIG = {
  week: "week10",
  weekLabel: "10",
  title: "Robotics & Perception",
  description: "Self-test: sensing, sensor fusion, and decision-making for autonomous robots.",
  // Paste your Apps Script /exec URL here once deployed. Leave blank to disable stats posting.
  scriptUrl: "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE",
  questions: [
    {
      id: "q1",
      prompt: "What is \"sensor fusion\" in robotics?",
      options: [
        { id: "a", text: "Physically welding two sensors together" },
        { id: "b", text: "Combining data from multiple sensors to produce a more accurate or reliable picture of the environment than any one sensor alone" },
        { id: "c", text: "Using only the single most expensive sensor available" },
        { id: "d", text: "Disabling all sensors except one to save power" },
      ],
      correct: "b",
      explanation: "Different sensors have different strengths and failure modes (e.g. a camera vs LiDAR vs IMU); fusing their data compensates for individual weaknesses and gives a more robust estimate of the robot's state and surroundings."
    },
    {
      id: "q2",
      prompt: "In the classic \"sense-plan-act\" robotics pipeline, what happens in the \"sense\" stage?",
      options: [
        { id: "a", text: "The robot decides on a long-term goal" },
        { id: "b", text: "The robot gathers raw information about its environment via sensors" },
        { id: "c", text: "The robot executes a motor command" },
        { id: "d", text: "The robot trains a new neural network from scratch" },
      ],
      correct: "b",
      explanation: "\"Sense\" is the perception stage — gathering raw sensor data — which then feeds into planning (deciding what to do) and acting (executing that decision via actuators)."
    },
    {
      id: "q3",
      prompt: "Which sensor type is most commonly used specifically for measuring distance to obstacles via light pulses?",
      options: [
        { id: "a", text: "LiDAR" },
        { id: "b", text: "A microphone" },
        { id: "c", text: "A thermometer" },
        { id: "d", text: "A barometer" },
      ],
      correct: "a",
      explanation: "LiDAR measures distance by timing reflected light pulses, producing a point-cloud map of nearby surfaces and obstacles — widely used in robotics and autonomous vehicles for depth perception."
    },
    {
      id: "q4",
      prompt: "Why is real-world robotics generally harder than the same task in a simulation?",
      options: [
        { id: "a", text: "Real-world sensors and actuators are noisy, and the environment isn't fully known or controllable in advance" },
        { id: "b", text: "Simulations are always exactly identical to the real world" },
        { id: "c", text: "Real-world robots never need to perceive anything" },
        { id: "d", text: "Physics behaves completely differently in the real world than any simulator could ever represent" },
      ],
      correct: "a",
      explanation: "Real sensors are noisy and imperfect, actuators don't execute commands exactly as intended, and the environment can contain unmodelled surprises — all things a simulation can hide or simplify away."
    },
    {
      id: "q5",
      prompt: "What does it mean when a foundation model is applied to robotics (\"embodied AI\")?",
      options: [
        { id: "a", text: "A large pre-trained model is adapted to help with perception, planning, or control, rather than hand-coding every rule for the robot from scratch" },
        { id: "b", text: "The robot is given a physical body made of the same material as a foundation" },
        { id: "c", text: "All robots must be identical to each other" },
        { id: "d", text: "The robot no longer needs any sensors" },
      ],
      correct: "a",
      explanation: "Embodied AI research increasingly adapts large pre-trained (foundation) models — trained on broad data — to robotic perception and decision-making tasks, rather than building every capability from hand-coded rules for that one robot."
    }
  ]
};
// ---- END CONFIG ----

let current = 0;
let score = 0;
const total = QUIZ_CONFIG.questions.length;

document.getElementById("weekNum").textContent = QUIZ_CONFIG.weekLabel;
document.getElementById("quizTitle").textContent = QUIZ_CONFIG.title;
document.getElementById("quizDesc").textContent = QUIZ_CONFIG.description;

function postResult(questionId, chosen, correct){
  if (!QUIZ_CONFIG.scriptUrl || QUIZ_CONFIG.scriptUrl.startsWith("PASTE_")) return;
  try{
    fetch(QUIZ_CONFIG.scriptUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        week: QUIZ_CONFIG.week,
        question_id: questionId,
        chosen: chosen,
        correct: correct
      })
    });
  }catch(err){ /* fail silently, stats are best-effort */ }
}

function renderQuestion(){
  const q = QUIZ_CONFIG.questions[current];
  document.getElementById("progressLabel").textContent = `Question ${current+1} of ${total}`;
  document.getElementById("progressFill").style.width = `${(current/total)*100}%`;

  const card = document.getElementById("card");
  card.innerHTML = "";

  const promptEl = document.createElement("p");
  promptEl.className = "prompt";
  promptEl.textContent = q.prompt;
  card.appendChild(promptEl);

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt.text;
    btn.addEventListener("click", () => selectOption(opt.id, btn));
    card.appendChild(btn);
  });

  const fb = document.createElement("div");
  fb.className = "feedback";
  fb.id = "feedback";
  card.appendChild(fb);

  const actions = document.createElement("div");
  actions.className = "actions";
  const nextBtn = document.createElement("button");
  nextBtn.className = "next";
  nextBtn.id = "nextBtn";
  nextBtn.textContent = current === total - 1 ? "See results" : "Next question";
  nextBtn.addEventListener("click", advance);
  actions.appendChild(nextBtn);
  card.appendChild(actions);
}

function selectOption(chosenId, btnEl){
  const q = QUIZ_CONFIG.questions[current];
  const isCorrect = chosenId === q.correct;
  if (isCorrect) score++;

  document.querySelectorAll(".option").forEach(b => {
    b.disabled = true;
    if (b === btnEl) b.classList.add(isCorrect ? "correct" : "incorrect");
    if (!isCorrect && b.textContent === q.options.find(o => o.id === q.correct).text){
      b.classList.add("correct");
    }
  });

  const fb = document.getElementById("feedback");
  fb.classList.add("show", isCorrect ? "correct-fb" : "incorrect-fb");
  fb.innerHTML = `<strong>${isCorrect ? "Correct." : "Not quite."}</strong>${q.explanation}`;

  document.getElementById("nextBtn").classList.add("show");
  postResult(q.id, chosenId, isCorrect);
}

function advance(){
  current++;
  if (current < total){
    renderQuestion();
  }else{
    showSummary();
  }
}

function showSummary(){
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("progressLabel").textContent = "Complete";
  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="summary">
      <p>You scored</p>
      <div class="score">${score} / ${total}</div>
      <button class="retake" id="retakeBtn">Retake quiz</button>
    </div>
  `;
  document.getElementById("retakeBtn").addEventListener("click", () => {
    current = 0; score = 0; renderQuestion();
  });
}

renderQuestion();
</script>
</body>
</html>
